appId: com.photomind.app
productName: photomind
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  target:
    - nsis
  artifactName: photomind v0.2.1.exe
mac:
  target:
    - dmg
  artifactName: mac alice v0.2.1-${arch}.dmg
  category: public.app-category.photography
  identity: null
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/